<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mapa 3D de Stands — Exposición Instituto Industrial Luis A. Huergo</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QNMPQ4PSW8"></script>
  <script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: radial-gradient(circle at 55% 35%, #162036 0%, #0b101b 70%, #060910 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
    #canvas-container.hover-stand { cursor: pointer; }

    .safe-top {
      padding-top: max(0.65rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }

    .glass-panel {
      background: rgba(11, 16, 27, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.20);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.50);
    }

    .floor-btn {
      transition: all 0.2s ease;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .floor-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.45);
      color: #ffffff;
    }
    .floor-btn.active {
      background: rgba(14, 165, 233, 0.30);
      border-color: rgba(56, 189, 248, 0.92);
      color: #f0f9ff;
      box-shadow: 0 0 16px rgba(14, 165, 233, 0.32);
    }

    .stand-list-item, .stand-chip {
      transition: all 0.18s ease;
      touch-action: manipulation;
    }
    .stand-list-item:hover, .stand-chip:hover {
      background: rgba(148, 163, 184, 0.16);
    }
    .stand-list-item.active, .stand-chip.active {
      background: rgba(30, 41, 59, 0.96);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.34), 0 6px 16px rgba(0, 0, 0, 0.38);
    }

    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 999px; }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Capa de Etiquetas 3D Proyectadas */
    #labels-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    /* Etiquetas Flotantes de Stands de Exposición */
    .stand-tag-3d {
      position: absolute;
      transform: translate(-50%, -100%);
      padding: 6px 10px 6px 8px;
      min-height: 30px;
      border-radius: 999px;
      background: rgba(11, 16, 27, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(148, 163, 184, 0.32);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.18s ease, opacity 0.2s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      z-index: 14;
    }
    .stand-tag-label {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    @media (max-width: 640px) {
      .stand-tag-3d {
        padding: 5px 9px 5px 7px;
        min-height: 28px;
        font-size: 10.5px;
      }
      .stand-tag-label {
        max-width: 138px;
      }
    }
    .stand-tag-3d:hover {
      transform: translate(-50%, -106%) scale(1.05);
      border-color: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.72);
      z-index: 24;
    }
    .stand-tag-3d.stand-selected {
      transform: translate(-50%, -110%) scale(1.08);
      z-index: 26;
      background: rgba(15, 23, 42, 0.98);
    }
    .stand-tag-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.22s ease-out;
    }
  </style>
</head>
<body>

  <!-- Contenedor 3D -->
  <div id="canvas-container"></div>
  <!-- Capa de Etiquetas 3D de Stands -->
  <div id="labels-layer"></div>

  <!-- Encabezado Superior Limpio y Responsivo -->
  <header class="fixed top-0 left-0 right-0 z-30 px-3 safe-top flex items-center justify-between gap-2 pointer-events-none">

      <div class="min-w-0">
        <h1 class="text-xs sm:text-sm font-semibold text-slate-100 tracking-wide leading-tight truncate">

        <svg class="w-4 h-4 text-sky-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

  <!-- Panel Derecho (SOLO Escritorio >= md): Stands del Piso Seleccionado -->
  <aside id="floor-panel" class="hidden fixed top-20 right-3 z-20 w-80 max-h-[calc(100dvh-11rem)] md:flex flex-col gap-2 pointer-events-none">
    <div id="floor-panel-card" class="hidden glass-panel pointer-events-auto rounded-2xl p-3.5 flex flex-col gap-2.5 overflow-hidden">
      <div class="flex items-center justify-between gap-2 shrink-0">

  <!-- Drawer Expandible de Lista Completa para Celular (< md) -->
  <div id="mobile-drawer-backdrop" class="hidden md:hidden fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-[2px]"></div>
  <div id="mobile-stands-drawer" class="hidden md:hidden fixed left-3 right-3 bottom-24 z-50 glass-panel rounded-2xl p-3.5 max-h-[62dvh] flex flex-col gap-2.5 animate-fade-up">

        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0 flex-1">

    <!-- Barra Principal de Selección de Pisos (Siempre visible, 5 botones sin scroll en celular) -->

          <span class="flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-sky-300 shrink-0"></span>
            <span class="sm:hidden text-[9px] font-mono text-slate-400">3</span>
          </span>
          <span class="sm:hidden leading-none">PB</span>
          <span class="hidden sm:inline">Planta Baja</span>

        <button type="button" data-floor="2"
          class="floor-btn min-h-[46px] sm:min-h-[40px] px-1.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-[11px] sm:text-xs font-medium border border-transparent text-slate-300 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2">
          <span class="flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
            <span class="sm:hidden text-[9px] font-mono text-slate-400">1</span>
          </span>
          <span class="sm:hidden leading-none">1° Piso</span>
          <span class="hidden sm:inline">Primer Piso</span>
          <span class="hidden sm:inline text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-slate-800/90 text-slate-300">1</span>
        </button>

        <button type="button" data-floor="3"
          class="floor-btn min-h-[46px] sm:min-h-[40px] px-1.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-[11px] sm:text-xs font-medium border border-transparent text-slate-300 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2">
          <span class="flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-lime-400 shrink-0"></span>
            <span class="sm:hidden text-[9px] font-mono text-slate-400">3</span>
          </span>
          <span class="leading-none">Entrepiso</span>
          <span class="hidden sm:inline text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-slate-800/90 text-slate-300">3</span>

        <button type="button" data-floor="4"

          <span class="flex items-center gap-1">

  <!-- Ayuda sutil de navegación 3D (solo escritorio) -->
  <div class="fixed bottom-4 left-3 hidden xl:flex items-center z-10 pointer-events-none">
    <div class="glass-panel rounded-lg px-2.5 py-1.5 text-[10px] text-slate-400 flex items-center gap-2.5">
      <span><strong class="text-slate-200">Arrastrar:</strong> Rotar</span>
      <span><strong class="text-slate-200">Rueda:</strong> Zoom</span>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. CONTROLADOR DE RESPALDO CON SOPORTE TÁCTIL COMPLETO (ROTATE + PINCH)
    // =========================================================================
    class FallbackOrbitControls {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.target = new THREE.Vector3(0, 5, 0);
        this.enableDamping = true;
        this.dampingFactor = 0.08;
        this.minDistance = 8;
        this.maxDistance = 195;
        this.maxPolarAngle = Math.PI * 0.495;

        this._spherical = new THREE.Spherical();
        this._sphericalDelta = new THREE.Spherical();
        this._panOffset = new THREE.Vector3();
        this._scale = 1;
        this._state = 0; // 0 none, 1 rotate, 2 pan, 3 pinch
        this._start = new THREE.Vector2();
        this._pinchDist = 0;

        this._onPointerDown = this._onPointerDown.bind(this);
        this._onPointerMove = this._onPointerMove.bind(this);
        this._onPointerUp = this._onPointerUp.bind(this);
        this._onWheel = this._onWheel.bind(this);
        this._onTouchStart = this._onTouchStart.bind(this);
        this._onTouchMove = this._onTouchMove.bind(this);
        this._onTouchEnd = this._onTouchEnd.bind(this);
        this._onContext = (e) => e.preventDefault();

        domElement.addEventListener('pointerdown', this._onPointerDown);
        window.addEventListener('pointermove', this._onPointerMove);
        window.addEventListener('pointerup', this._onPointerUp);
        domElement.addEventListener('wheel', this._onWheel, { passive: false });
        domElement.addEventListener('touchstart', this._onTouchStart, { passive: false });
        domElement.addEventListener('touchmove', this._onTouchMove, { passive: false });
        domElement.addEventListener('touchend', this._onTouchEnd);
        domElement.addEventListener('contextmenu', this._onContext);
        this.update();
      }
      _panBy(dx, dy) {
        const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
        const dist = offset.length() * Math.tan((this.camera.fov / 2) * Math.PI / 180);
        const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrix, 1);
        this._panOffset.addScaledVector(right, -2 * dx * dist / this.domElement.clientHeight);
        this._panOffset.addScaledVector(up, 2 * dy * dist / this.domElement.clientHeight);
      }
      _onPointerDown(e) {
        if (e.pointerType === 'touch') return;
        this._start.set(e.clientX, e.clientY);
        this._state = (e.button === 2 || e.shiftKey) ? 2 : 1;
      }
      _onPointerMove(e) {
        if (e.pointerType === 'touch' || this._state === 0) return;
        const dx = e.clientX - this._start.x;
        const dy = e.clientY - this._start.y;
        this._start.set(e.clientX, e.clientY);
        if (this._state === 1) {
          this._sphericalDelta.theta -= (2 * Math.PI * dx) / this.domElement.clientHeight;
          this._sphericalDelta.phi -= (2 * Math.PI * dy) / this.domElement.clientHeight;
        } else if (this._state === 2) {
          this._panBy(dx, dy);
        }
      }
      _onPointerUp(e) {
        if (e.pointerType === 'touch') return;
        this._state = 0;
      }
      _onTouchStart(e) {
        if (e.touches.length === 1) {
          this._state = 1;
          this._start.set(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
          this._state = 3;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this._pinchDist = Math.hypot(dx, dy);
          this._start.set(
            (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
            (e.touches[0].clientY + e.touches[1].clientY) * 0.5
          );
        }
      }
      _onTouchMove(e) {
        e.preventDefault();
        if (this._state === 1 && e.touches.length === 1) {
          const dx = e.touches[0].clientX - this._start.x;
          const dy = e.touches[0].clientY - this._start.y;
          this._start.set(e.touches[0].clientX, e.touches[0].clientY);
          this._sphericalDelta.theta -= (1.8 * Math.PI * dx) / this.domElement.clientHeight;
          this._sphericalDelta.phi -= (1.8 * Math.PI * dy) / this.domElement.clientHeight;
        } else if (this._state === 3 && e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (this._pinchDist > 10 && dist > 10) {
            this._scale *= this._pinchDist / dist;
          }
          this._pinchDist = dist;
          const midX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
          this._panBy(midX - this._start.x, midY - this._start.y);
          this._start.set(midX, midY);
        }
      }
      _onTouchEnd(e) {
        if (e.touches.length === 1) {
          this._state = 1;
          this._start.set(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 0) {
          this._state = 0;
        }
      }
      _onWheel(e) {
        e.preventDefault();
        this._scale *= (e.deltaY > 0) ? 1.09 : 0.92;
      }
      update() {
        const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
        this._spherical.setFromVector3(offset);
        this._spherical.theta += this._sphericalDelta.theta;
        this._spherical.phi += this._sphericalDelta.phi;
        this._spherical.phi = Math.max(0.08, Math.min(this.maxPolarAngle, this._spherical.phi));
        this._spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this._spherical.radius * this._scale));
        this.target.add(this._panOffset);
        offset.setFromSpherical(this._spherical);
        this.camera.position.copy(this.target).add(offset);
        this.camera.lookAt(this.target);

        const damp = this.enableDamping ? (1 - this.dampingFactor) : 0;
        this._sphericalDelta.theta *= damp;
        this._sphericalDelta.phi *= damp;
        this._panOffset.multiplyScalar(damp);
        this._scale = 1;
      }

    // =========================================================================
    // 5. PALETA ARQUITECTÓNICA POR NIVEL
    // =========================================================================
    function createLevelPalette() {
      const mk = (color, opts = {}) => {
        const m = new THREE.MeshStandardMaterial({
          color,
          roughness: opts.roughness !== undefined ? opts.roughness : 0.78,
          metalness: opts.metalness !== undefined ? opts.metalness : 0.06,
          transparent: !!opts.transparent,
          opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
          side: opts.doubleSide ? THREE.DoubleSide : THREE.FrontSide,
          depthWrite: opts.depthWrite !== undefined ? opts.depthWrite : true
        });
        m.userData = {
          baseOpacity: m.opacity,
          baseTransparent: m.transparent,
          baseDepthWrite: m.depthWrite,
          category: opts.category || 'wall'
        };
        return m;
      };

      return {
        wall: mk(0xeaecef, { roughness: 0.84, category: 'wall', doubleSide: true }),
        wallInterior: mk(0xe2e6ec, { roughness: 0.85, category: 'wall', doubleSide: true }),
        wallSage: mk(0x889984, { roughness: 0.88, category: 'wall', doubleSide: true }),
        dadoGrey: mk(0x545b66, { roughness: 0.65, category: 'wall', doubleSide: true }),
        dadoBrick: mk(0x8b4238, { roughness: 0.85, category: 'wall', doubleSide: true }),
        slab: mk(0xcfd5de, { roughness: 0.86, category: 'slab' }),
        slabRoof: mk(0xb7bfca, { roughness: 0.90, category: 'slab' }),
        slabCourt: mk(0x2d6d60, { roughness: 0.82, category: 'slab' }),
        slabGym: mk(0x3a4846, { roughness: 0.72, category: 'slab' }),
        slabTerrazzo: mk(0xc4bfb4, { roughness: 0.68, category: 'slab' }),
        column: mk(0xdce1e8, { roughness: 0.75, category: 'structure' }),
        padBlue: mk(0x25539c, { roughness: 0.65, category: 'detail' }),
        facadeGranite: mk(0x22272f, { roughness: 0.35, metalness: 0.18, category: 'facade' }),
        facadePilaster: mk(0xa4aab3, { roughness: 0.82, category: 'facade' }),
        facadeOchre: mk(0xbaa074, { roughness: 0.90, category: 'facade' }),
        facadeInd: mk(0xc2beb6, { roughness: 0.92, category: 'facade' }),
        gateMetal: mk(0x2a303a, { roughness: 0.45, metalness: 0.55, category: 'detail' }),
        glass: mk(0x7cc4ea, { roughness: 0.12, metalness: 0.15, transparent: true, opacity: 0.34, depthWrite: false, doubleSide: true, category: 'glass' }),
        frameDark: mk(0x2b323d, { roughness: 0.45, metalness: 0.45, category: 'detail' }),
        marble: mk(0xede7db, { roughness: 0.32, metalness: 0.05, category: 'stair' }),
        stairStep: mk(0x868c94, { roughness: 0.72, category: 'stair' }),
        rampSurface: mk(0x3a414c, { roughness: 0.82, category: 'stair' }),
        nosingYellow: mk(0xeab308, { roughness: 0.5, category: 'stair' }),
        railingIron: mk(0x1f252e, { roughness: 0.4, metalness: 0.6, category: 'railing' }),
        railingYellow: mk(0xeab308, { roughness: 0.45, metalness: 0.2, category: 'railing' }),
        lineWhite: mk(0xf8fafc, { roughness: 0.6, category: 'detail' }),
        furniture: mk(0x475569, { roughness: 0.65, category: 'detail' })
      };
    }

    // =========================================================================
    // 6. CONSTRUCTORES GEOMÉTRICOS DE PRECISIÓN ARQUITECTÓNICA
    // =========================================================================
    function tagMesh(mesh, levelIdx, clickable = true) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.levelIndex = levelIdx;
      if (clickable && mesh.material && mesh.material.userData && mesh.material.userData.category !== 'glass') {
        clickableMeshes.push(mesh);
      }
      return mesh;
    }

    function addBox(parent, levelIdx, x, y, z, w, h, d, mat, opts = {}) {
      if (w <= 0.001 || h <= 0.001 || d <= 0.001) return null;
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x + w / 2, y + h / 2, z + d / 2);
      if (opts.noShadow) {
        mesh.castShadow = false;
        mesh.receiveShadow = opts.receiveShadow !== false;
      } else {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
      }
      mesh.userData.levelIndex = levelIdx;
      if (opts.clickable !== false && mat.userData && mat.userData.category !== 'glass') {
        clickableMeshes.push(mesh);
      }
      parent.add(mesh);

      if (opts.edges) {
        const eg = new THREE.EdgesGeometry(geo, 28);
        const em = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.35 });
        const lines = new THREE.LineSegments(eg, em);
        lines.userData.levelIndex = levelIdx;
        lines.userData.isEdge = true;
        mesh.add(lines);
      }
      return mesh;
    }

    function addSlabWithHoles(parent, levelIdx, x0, z0, w, d, yTop, thickness, holes, mat) {
      const shape = new THREE.Shape();
      shape.moveTo(x0, -(z0 + d));
      shape.lineTo(x0 + w, -(z0 + d));
      shape.lineTo(x0 + w, -z0);
      shape.lineTo(x0, -z0);
      shape.closePath();

      (holes || []).forEach(h => {
        const path = new THREE.Path();
        path.moveTo(h.x, -(h.z + h.d));
        path.lineTo(h.x, -h.z);
        path.lineTo(h.x + h.w, -h.z);
        path.lineTo(h.x + h.w, -(h.z + h.d));
        path.closePath();
        shape.holes.push(path);
      });

      const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, yTop - thickness, 0);
      tagMesh(mesh, levelIdx, true);
      parent.add(mesh);

      const eg = new THREE.EdgesGeometry(geo, 35);
      const lines = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.35 }));
      lines.userData.levelIndex = levelIdx;
      lines.userData.isEdge = true;
      mesh.add(lines);
      return mesh;
    }

    function addRailing(parent, levelIdx, x0, z0, x1, z1, yBase, h, mat, ornate = false) {
      const dx = x1 - x0;
      const dz = z1 - z0;
      const len = Math.hypot(dx, dz);
      if (len < 0.1) return;
      const angle = Math.atan2(-dz, dx);

      const g = new THREE.Group();
      g.position.set(x0, yBase, z0);
      g.rotation.y = angle;

      addBox(g, levelIdx, 0, h - 0.06, -0.035, len, 0.06, 0.07, mat, { clickable: false });
      addBox(g, levelIdx, 0, 0.08, -0.025, len, 0.04, 0.05, mat, { clickable: false });
      if (ornate) {
        addBox(g, levelIdx, 0, h * 0.52, -0.02, len, 0.035, 0.04, mat, { clickable: false });
      }

      const step = ornate ? 0.24 : 0.45;
      const count = Math.max(2, Math.floor(len / step));
      for (let i = 0; i <= count; i++) {
        const px = (i / count) * len;
        const thick = (i === 0 || i === count) ? 0.065 : (ornate ? 0.03 : 0.035);
        addBox(g, levelIdx, px - thick / 2, 0, -thick / 2, thick, h, thick, mat, { clickable: false });
      }
      parent.add(g);
    }

    function addHoleRailings(parent, levelIdx, hole, yBase, mat, skipSides = {}) {
      const h = 1.02;
      const m = 0.06;
      if (!skipSides.N) addRailing(parent, levelIdx, hole.x + m, hole.z + m, hole.x + hole.w - m, hole.z + m, yBase, h, mat);
      if (!skipSides.S) addRailing(parent, levelIdx, hole.x + m, hole.z + hole.d - m, hole.x + hole.w - m, hole.z + hole.d - m, yBase, h, mat);
      if (!skipSides.W) addRailing(parent, levelIdx, hole.x + m, hole.z + m, hole.x + m, hole.z + hole.d - m, yBase, h, mat);
      if (!skipSides.E) addRailing(parent, levelIdx, hole.x + hole.w - m, hole.z + m, hole.x + hole.w - m, hole.z + hole.d - m, yBase, h, mat);
    }

    function addWindowWall(parent, levelIdx, x0, z0, x1, z1, yBase, height, sillH, headH, panes, p, wallMat) {
      const dx = x1 - x0;
      const dz = z1 - z0;
      const len = Math.hypot(dx, dz);
      if (len < 0.2) return;
      const angle = Math.atan2(-dz, dx);
      const t = 0.22;

      const g = new THREE.Group();
      g.position.set(x0, yBase, z0);
      g.rotation.y = angle;
      const wm = wallMat || p.wall;

      if (sillH > 0.02) addBox(g, levelIdx, 0, 0, -t / 2, len, sillH, t, wm);
      const lintelH = height - headH;
      if (lintelH > 0.02) addBox(g, levelIdx, 0, headH, -t / 2, len, lintelH, t, wm);

      const winH = headH - sillH;
      if (winH > 0.1) {
        addBox(g, levelIdx, 0.05, sillH + 0.04, -0.02, len - 0.1, winH - 0.08, 0.04, p.glass, { clickable: false, noShadow: true });
        addBox(g, levelIdx, 0, sillH, -0.06, len, 0.05, 0.12, p.frameDark, { clickable: false });
        addBox(g, levelIdx, 0, headH - 0.05, -0.06, len, 0.05, 0.12, p.frameDark, { clickable: false });
        const count = Math.max(1, panes);
        for (let i = 0; i <= count; i++) {
          const px = (i / count) * len;
          addBox(g, levelIdx, px - 0.03, sillH, -0.06, 0.06, winH, 0.12, p.frameDark, { clickable: false });
        }
      }
      parent.add(g);
    }

    function addStairFlight(parent, levelIdx, opts, p) {
      const {
        x, yStart, z,
        run, rise, width,
        steps, dir = '+X',
        stepMat = p.stairStep,
        yellowNosing = true,
        leftRail = true,
        rightRail = true,
        centerRail = false,
        ornateRail = false,
        solidBase = false
      } = opts;

      const g = new THREE.Group();
      const tread = run / steps;
      const riser = rise / steps;

      for (let i = 0; i < steps; i++) {
        const sx = i * tread;
        const sy = i * riser;
        const stepH = solidBase ? (sy + riser) : (riser + 0.18);
        const stepY = solidBase ? 0 : Math.max(0, sy - 0.18);
        addBox(g, levelIdx, sx, stepY, -width / 2, tread + 0.03, stepH, width, stepMat);

        if (yellowNosing) {
          addBox(g, levelIdx, sx, sy + riser - 0.015, -width / 2 + 0.04, 0.065, 0.022, width - 0.08, p.nosingYellow, { clickable: false, noShadow: true });
        }
      }

      const addInclinedRail = (zPos) => {
        const railLen = Math.hypot(run, rise);
        const pitch = Math.atan2(rise, run);
        const railMat = p.railingIron;
        const rh = 0.96;

        const barGeo = new THREE.BoxGeometry(railLen, 0.06, 0.06);
        const bar = new THREE.Mesh(barGeo, railMat);
        bar.position.set(run / 2, rise / 2 + rh, zPos);
        bar.rotation.z = pitch;
        tagMesh(bar, levelIdx, false);
        g.add(bar);

        if (ornateRail) {
          const midBar = new THREE.Mesh(new THREE.BoxGeometry(railLen, 0.035, 0.04), railMat);
          midBar.position.set(run / 2, rise / 2 + rh * 0.52, zPos);
          midBar.rotation.z = pitch;
          tagMesh(midBar, levelIdx, false);
          g.add(midBar);
        }

        const postCount = ornateRail ? Math.max(6, Math.floor(steps * 1.1)) : Math.max(3, Math.floor(steps / 3));
        for (let j = 0; j <= postCount; j++) {
          const t = j / postCount;
          const px = t * run;
          const py = t * rise;
          const thick = (j === 0 || j === postCount) ? 0.08 : (ornateRail ? 0.032 : 0.04);
          addBox(g, levelIdx, px - thick / 2, py, zPos - thick / 2, thick, rh, thick, railMat, { clickable: false });
        }
      };

      if (leftRail) addInclinedRail(-width / 2 + 0.06);
      if (rightRail) addInclinedRail(width / 2 - 0.06);
      if (centerRail) addInclinedRail(0);

      g.position.set(x, yStart, z);
      if (dir === '+X') g.rotation.y = 0;
      else if (dir === '-X') g.rotation.y = Math.PI;
      else if (dir === '+Z') g.rotation.y = -Math.PI / 2;
      else if (dir === '-Z') g.rotation.y = Math.PI / 2;

      parent.add(g);
    }

    function addRamp(parent, levelIdx, opts, p) {
      const {
        x, yStart, z,
        run, rise, width,
        dir = '+X',
        mat = p.rampSurface,
        solidUnder = true,
        rails = true
      } = opts;

      const g = new THREE.Group();
      const shape = new THREE.Shape();
      const minY = Math.min(0, rise) - (solidUnder ? 0.35 : 0);

      if (solidUnder) {
        shape.moveTo(0, minY);
        shape.lineTo(run, minY);
        shape.lineTo(run, rise);
        shape.lineTo(0, 0);
        shape.closePath();
      } else {
        shape.moveTo(0, -0.22);
        shape.lineTo(run, rise - 0.22);
        shape.lineTo(run, rise);
        shape.lineTo(0, 0);
        shape.closePath();
      }

      const geo = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: false });
      geo.translate(0, 0, -width / 2);
      const mesh = new THREE.Mesh(geo, mat);
      tagMesh(mesh, levelIdx, true);
      g.add(mesh);

      addBox(g, levelIdx, 0.05, 0.005, -width / 2 + 0.1, 0.14, 0.015, width - 0.2, p.nosingYellow, { clickable: false, noShadow: true });
      addBox(g, levelIdx, run - 0.19, rise + 0.005, -width / 2 + 0.1, 0.14, 0.015, width - 0.2, p.nosingYellow, { clickable: false, noShadow: true });

      if (rails) {
        const railLen = Math.hypot(run, rise);
        const pitch = Math.atan2(rise, run);
        [-width / 2 + 0.07, width / 2 - 0.07].forEach(zPos => {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(railLen, 0.05, 0.05), p.railingIron);
          bar.position.set(run / 2, rise / 2 + 0.92, zPos);
          bar.rotation.z = pitch;
          tagMesh(bar, levelIdx, false);
          g.add(bar);
          for (let j = 0; j <= 4; j++) {
            const t = j / 4;
            addBox(g, levelIdx, t * run - 0.02, t * rise, zPos - 0.02, 0.04, 0.92, 0.04, p.railingIron, { clickable: false });
          }
        });
      }

      g.position.set(x, yStart, z);
      if (dir === '+X') g.rotation.y = 0;
      else if (dir === '-X') g.rotation.y = Math.PI;
      else if (dir === '+Z') g.rotation.y = -Math.PI / 2;
      else if (dir === '-Z') g.rotation.y = Math.PI / 2;

      parent.add(g);
    }

    function addMainFacadeBand(parent, levelIdx, yBase, height, p, isTopFloor = false) {
      const pilasterZ = [0, 4.9, 10.1, 14.4];
      const pilasterW = [0.65, 0.65, 0.65, 0.60];

      for (let i = 0; i < pilasterZ.length; i++) {
        addBox(parent, levelIdx, -0.15, yBase, pilasterZ[i], 0.50, height, pilasterW[i], p.facadePilaster, { edges: true });
      }

      const bays = [
        { z0: 0.65, z1: 4.9 },
        { z0: 5.55, z1: 10.1 },
        { z0: 10.75, z1: 14.4 }
      ];
      const spandrelH = height * 0.44;
      const winH = height * 0.44;
      const headH = height - spandrelH - winH;

      bays.forEach(b => {
        const bw = b.z1 - b.z0;
        addBox(parent, levelIdx, 0.0, yBase, b.z0, 0.30, spandrelH, bw, p.facadeOchre, { edges: true });
        addBox(parent, levelIdx, 0.0, yBase + spandrelH + winH, b.z0, 0.30, headH, bw, p.facadePilaster);
        addBox(parent, levelIdx, 0.14, yBase + spandrelH + 0.04, b.z0 + 0.05, 0.04, winH - 0.08, bw - 0.1, p.glass, { clickable: false, noShadow: true });
        addBox(parent, levelIdx, 0.08, yBase + spandrelH, b.z0, 0.12, 0.06, bw, p.frameDark, { clickable: false });
        addBox(parent, levelIdx, 0.08, yBase + spandrelH + winH - 0.06, b.z0, 0.12, 0.06, bw, p.frameDark, { clickable: false });
        for (let k = 0; k <= 3; k++) {
          const kz = b.z0 + (k / 3) * bw;
          addBox(parent, levelIdx, 0.08, yBase + spandrelH, kz - 0.03, 0.12, winH, 0.06, p.frameDark, { clickable: false });
        }
      });

      if (isTopFloor) {
        addBox(parent, levelIdx, -0.18, yBase + height, 0, 0.56, 0.55, 15.0, p.facadePilaster, { edges: true });
      }
    }

    function buildStands() {
      STANDS_DATA.forEach(stand => {
        const parentLevelGroup = levelGroups[stand.level];
        if (!parentLevelGroup) return;

        const standGroup = new THREE.Group();
        standGroup.name = 'stand_' + stand.id;
        standGroup.userData.isStandGroup = true;
        standGroup.userData.standId = stand.id;

        const baseColor = new THREE.Color(stand.color);
        const edgeColor = new THREE.Color(stand.borderColor || stand.color);

        // Material translúcido luminoso del prisma
        const bodyMat = new THREE.MeshStandardMaterial({
          color: baseColor,
          emissive: baseColor,
          emissiveIntensity: 0.35,
          roughness: 0.28,
          metalness: 0.05,
          transparent: true,
          opacity: 0.56,
          depthWrite: false,
          side: THREE.DoubleSide,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        });

        // Base de piso coloreada para anclar visualmente el stand sobre la losa
        const baseMat = new THREE.MeshStandardMaterial({
          color: baseColor,
          emissive: baseColor,
          emissiveIntensity: 0.42,
          roughness: 0.45,
          metalness: 0.05,
          transparent: true,
          opacity: 0.88
        });

        // Aristas nítidas luminosas
        const edgeMat = new THREE.LineBasicMaterial({
          color: edgeColor,
          transparent: true,
          opacity: 0.95
        });

        stand.prisms.forEach(box => {
          // Prisma principal translúcido
          const prismGeo = new THREE.BoxGeometry(box.w, box.h, box.d);
          const prismMesh = new THREE.Mesh(prismGeo, bodyMat);
          prismMesh.position.set(box.x + box.w / 2, box.y + box.h / 2, box.z + box.d / 2);
          prismMesh.renderOrder = 4;
          prismMesh.userData.standId = stand.id;
          prismMesh.userData.levelIndex = stand.level;
          standGroup.add(prismMesh);
          standClickableMeshes.push(prismMesh);

          // Contorno 3D del prisma
          const edgesGeo = new THREE.EdgesGeometry(prismGeo);
          const edgeLines = new THREE.LineSegments(edgesGeo, edgeMat);
          edgeLines.position.copy(prismMesh.position);
          edgeLines.renderOrder = 5;
          standGroup.add(edgeLines);

          // Placa base sólida sobre el piso
          const plateGeo = new THREE.BoxGeometry(box.w, 0.09, box.d);
          const plateMesh = new THREE.Mesh(plateGeo, baseMat);
          plateMesh.position.set(box.x + box.w / 2, box.y + 0.045, box.z + box.d / 2);
          plateMesh.userData.standId = stand.id;
          plateMesh.userData.levelIndex = stand.level;
          standGroup.add(plateMesh);
        });

        parentLevelGroup.add(standGroup);
        standVisuals[stand.id] = { stand, group: standGroup, bodyMat, baseMat, edgeMat };
      });
    }

    // =========================================================================
    // 9. ENTORNO URBANO 3D DETALLADO DE CALLE PERÚ (SIN EDIFICIOS AL OESTE)
    // =========================================================================
    function createCobblestoneTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#1b2029';
      ctx.fillRect(0, 0, 512, 512);

      const rows = 16;
      const cols = 10;
      const rowH = 512 / rows;
      const colW = 512 / cols;
      let seed = 1337;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let r = 0; r < rows; r++) {
        const offsetX = (r % 2) * (colW * 0.5);
        for (let c = -1; c <= cols; c++) {
          const x = c * colW + offsetX + 2;
          const y = r * rowH + 2;
          const w = colW - 4;
          const h = rowH - 4;

          const lum = 74 + Math.floor(rand() * 38);
          const warm = Math.floor((rand() - 0.45) * 12);
          ctx.fillStyle = `rgb(${lum + warm}, ${lum + 2}, ${lum + 6 - Math.floor(warm * 0.5)})`;
          ctx.fillRect(x, y, w, h);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.11)';
          ctx.fillRect(x, y, w, 2.5);
          ctx.fillStyle = 'rgba(10, 14, 22, 0.22)';
          ctx.fillRect(x, y + h - 2.5, w, 2.5);
        }
      }

      for (let i = 0; i < 1800; i++) {
        const gx = Math.floor(rand() * 512);
        const gy = Math.floor(rand() * 512);
        ctx.fillStyle = rand() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)';
        ctx.fillRect(gx, gy, 2, 2);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3.2, 22);
      tex.anisotropy = 4;
      return tex;
    }

    function createSidewalkTexture(repeatX, repeatY, warmTint = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = warmTint ? '#9c9a92' : '#8d9299';
      ctx.fillRect(0, 0, 256, 256);

      const step = 64;
      let seed = warmTint ? 421 : 907;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let y = 0; y < 256; y += step) {
        for (let x = 0; x < 256; x += step) {
          const delta = Math.floor((rand() - 0.5) * 14);
          const baseR = (warmTint ? 156 : 142) + delta;
          const baseG = (warmTint ? 153 : 146) + delta;
          const baseB = (warmTint ? 144 : 152) + delta;
          ctx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
          ctx.fillRect(x + 2, y + 2, step - 4, step - 4);

          ctx.strokeStyle = 'rgba(30, 36, 46, 0.20)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 2, y + 2, step - 4, step - 4);
          ctx.beginPath();
          ctx.moveTo(x + step / 2, y + 2);
          ctx.lineTo(x + step / 2, y + step - 2);
          ctx.moveTo(x + 2, y + step / 2);
          ctx.lineTo(x + step - 2, y + step / 2);
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = 4;
      return tex;
    }

    function createStreetMarkingTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 256);

      ctx.save();
      ctx.font = '700 132px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(226, 232, 240, 0.72)';
      ctx.fillText(text, 256, 134);
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 4;
      return tex;
    }

    function createUrbanSignTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 176;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#1d4ed8';
      ctx.fillRect(0, 0, 128, 176);
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 7;
      ctx.strokeRect(7, 7, 114, 162);

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(18, 20, 92, 74);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(46, 40, 8, 0, Math.PI * 2);
      ctx.arc(78, 44, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(40, 50, 12, 30);
      ctx.fillRect(72, 53, 12, 27);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 16px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PERÚ', 64, 126);
      ctx.font = '600 13px Inter, Arial, sans-serif';
      ctx.fillText('700 - 800', 64, 148);

      return new THREE.CanvasTexture(canvas);
    }

          pg.add(bush);

        streetDetailsGroup.add(pg);

      addPlanterWithShrubs(-13.8, -14.8, 2.3, 4.4, [

        { ox: 0.30, oz: -0.4, r: 0.56, c: 1 },
        { ox: -0.20, oz: 0.6, r: 0.52, c: 2 },
        { ox: 0.32, oz: 1.35, r: 0.42, c: 0 }
      ]);
      addPlanterWithShrubs(-14.6, -2.5, 2.4, 5.2, [
        { ox: -0.4, oz: -1.6, r: 0.55, c: 1 },
        { ox: 0.25, oz: -0.7, r: 0.62, c: 0 },
        { ox: -0.25, oz: 0.5, r: 0.50, c: 2 },
        { ox: 0.35, oz: 1.5, r: 0.54, c: 1 }
      ]);
      addPlanterWithShrubs(-13.8, 8.8, 2.3, 4.6, [
        { ox: -0.3, oz: -1.3, r: 0.52, c: 2 },
        { ox: 0.25, oz: -0.2, r: 0.58, c: 0 },
        { ox: -0.15, oz: 0.9, r: 0.46, c: 1 },
        { ox: 0.35, oz: 1.45, r: 0.40, c: 2 }
      ]);

      const addUrbanBench = (bx, bz) => {
        const bg = new THREE.Group();
        bg.position.set(bx, 0.0, bz);

        [-0.82, 0.82].forEach(zOff => {
          mkStreetBox(bg, -0.28, 0.0, zOff - 0.04, 0.56, 0.44, 0.08, matCastIron, true, true);
          mkStreetBox(bg, -0.30, 0.44, zOff - 0.04, 0.07, 0.42, 0.08, matCastIron, true, true);
        });
        [-0.18, 0.0, 0.18].forEach(xOff => {
          mkStreetBox(bg, xOff - 0.06, 0.44, -0.98, 0.12, 0.045, 1.96, matWood, true, true);
        });
        [0.62, 0.78].forEach(yOff => {
          mkStreetBox(bg, -0.26, yOff, -0.98, 0.045, 0.11, 1.96, matWood, true, true);
        });

        streetDetailsGroup.add(bg);
      };

      addUrbanBench(-15.2, -9.2);
      addUrbanBench(-15.2, 2.6);
      addUrbanBench(-15.2, 14.2);

      // 9. Arbolado urbano porteño
      const addPortenoTree = (opts) => {
        const {
          x, z, height = 8.2, leanX = 0.08, leanZ = 0.04,
          canopyScale = 1.0, blossomType = null, pitSize = 1.6
        } = opts;

        const tg = new THREE.Group();
        tg.position.set(x, 0.0, z);

        const rimT = 0.10;
        mkStreetBox(tg, -pitSize / 2, 0, -pitSize / 2, pitSize, 0.10, rimT, matStonePlanter, false, true);
        mkStreetBox(tg, -pitSize / 2, 0, pitSize / 2 - rimT, pitSize, 0.10, rimT, matStonePlanter, false, true);
        mkStreetBox(tg, -pitSize / 2, 0, -pitSize / 2, rimT, 0.10, pitSize, matStonePlanter, false, true);
        mkStreetBox(tg, pitSize / 2 - rimT, 0, -pitSize / 2, rimT, 0.10, pitSize, matStonePlanter, false, true);
        mkStreetBox(tg, -pitSize / 2 + rimT, 0.01, -pitSize / 2 + rimT, pitSize - rimT * 2, 0.06, pitSize - rimT * 2, matSoil, false, true);

        const trunkH = height * 0.48;
        const trunkRTop = 0.15 * canopyScale;
        const trunkRBot = 0.24 * canopyScale;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(trunkRTop, trunkRBot, trunkH, 9), matBark);
        trunk.position.set(leanX * trunkH * 0.5, trunkH * 0.5, leanZ * trunkH * 0.5);
        trunk.rotation.z = -leanX;
        trunk.rotation.x = leanZ;
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        tg.add(trunk);

        const forkX = leanX * trunkH;
        const forkY = trunkH * 0.94;
        const forkZ = leanZ * trunkH;

        const branches = [
          { dx: 1.15, dy: 2.1, dz: 0.65, r: 1.55 },
          { dx: -0.95, dy: 2.35, dz: 0.75, r: 1.48 },
          { dx: 0.35, dy: 2.65, dz: -1.05, r: 1.52 },
          { dx: -0.85, dy: 1.95, dz: -0.85, r: 1.32 },
          { dx: 0.15, dy: 3.15, dz: 0.10, r: 1.62 }
        ];

        branches.forEach((b, bi) => {
          const bx = b.dx * canopyScale;
          const by = b.dy * canopyScale;
          const bz = b.dz * canopyScale;
          const len = Math.hypot(bx, by, bz);

          const branchMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.055 * canopyScale, 0.115 * canopyScale, len, 7),
            matBark
          );
          const dirVec = new THREE.Vector3(bx, by, bz).normalize();
          branchMesh.position.set(forkX + bx * 0.5, forkY + by * 0.5, forkZ + bz * 0.5);
          branchMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirVec);
          branchMesh.castShadow = true;
          tg.add(branchMesh);

          const tipX = forkX + bx;
          const tipY = forkY + by;
          const tipZ = forkZ + bz;
          const mainR = b.r * canopyScale;

          const puff1 = new THREE.Mesh(
            new THREE.IcosahedronGeometry(mainR, 1),
            matFoliage[bi % matFoliage.length]
          );
          puff1.position.set(tipX, tipY + 0.15 * canopyScale, tipZ);
          puff1.scale.set(1.18, 0.78, 1.12);
          puff1.rotation.set(bi * 0.7, bi * 1.1, bi * 0.4);
          puff1.castShadow = true;
          puff1.receiveShadow = true;
          tg.add(puff1);

          const puff2 = new THREE.Mesh(
            new THREE.DodecahedronGeometry(mainR * 0.72, 1),
            matFoliage[(bi + 1) % matFoliage.length]
          );
          puff2.position.set(
            tipX + (bi % 2 === 0 ? 0.55 : -0.55) * canopyScale,
            tipY + 0.48 * canopyScale,
            tipZ + (bi % 2 === 0 ? -0.4 : 0.45) * canopyScale
          );
          puff2.scale.set(1.08, 0.75, 1.05);
          puff2.castShadow = true;
          tg.add(puff2);

          if (blossomType && bi % 2 === 0) {
            const blMat = blossomType === 'jacaranda' ? matBlossomJacaranda : matBlossomSpring;
            const bl = new THREE.Mesh(new THREE.DodecahedronGeometry(mainR * 0.36, 0), blMat);
            bl.position.set(
              tipX + 0.32 * canopyScale,
              tipY + 0.65 * canopyScale,
              tipZ - 0.22 * canopyScale
            );
            bl.scale.set(1.2, 0.65, 1.1);
            tg.add(bl);
          }
        });

        streetDetailsGroup.add(tg);
      };

      // 6 árboles en la vereda opuesta
      addPortenoTree({ x: -12.4, z: -18.8, height: 8.6, leanX: 0.10, leanZ: 0.04, canopyScale: 1.02, blossomType: 'spring' });
      addPortenoTree({ x: -11.8, z: -11.0, height: 9.4, leanX: 0.14, leanZ: -0.03, canopyScale: 1.12, blossomType: 'jacaranda' });
      addPortenoTree({ x: -12.2, z: -3.2,  height: 7.8, leanX: 0.09, leanZ: 0.05, canopyScale: 0.94 });
      addPortenoTree({ x: -11.9, z: 4.8,   height: 9.8, leanX: 0.13, leanZ: -0.02, canopyScale: 1.15, blossomType: 'jacaranda' });
      addPortenoTree({ x: -12.5, z: 12.6,  height: 8.4, leanX: 0.08, leanZ: 0.04, canopyScale: 1.00, blossomType: 'spring' });
      addPortenoTree({ x: -14.8, z: 19.2,  height: 7.4, leanX: 0.06, leanZ: -0.04, canopyScale: 0.90 });

      // 2 árboles menores en extremos Norte y Sur de la vereda del colegio
      addPortenoTree({ x: -2.15, z: -19.6, height: 6.2, leanX: -0.07, leanZ: 0.02, canopyScale: 0.72, pitSize: 1.25 });
      addPortenoTree({ x: -2.15, z: 19.6,  height: 6.4, leanX: -0.06, leanZ: -0.03, canopyScale: 0.74, pitSize: 1.25, blossomType: 'spring' });

      scene.add(site);
    }

    // =========================================================================
    // 10. VISUALIZACIÓN POR PISO AISLADO Y STANDS (SIN RAYOS X)
    // =========================================================================
    function updateVisualMaterials() {
      const sel = state.selectedLevel;
      const isOverview = (sel === -1);

      // 1. Mostrar todo el edificio en vista inicial, o aislar únicamente el piso elegido
      levelGroups.forEach((grp, idx) => {
        grp.visible = isOverview ? true : (idx === sel);

        const pal = levelPalettes[idx];
        Object.keys(pal).forEach(key => {
          const mat = pal[key];
          mat.opacity = mat.userData.baseOpacity;
          mat.transparent = mat.userData.baseTransparent;
          mat.depthWrite = mat.userData.baseDepthWrite;
          mat.emissive.setHex(0x000000);
          mat.needsUpdate = true;
        });

        grp.traverse(obj => {
          if (obj.userData && obj.userData.isEdge) {
            obj.material.opacity = 0.34;
          }
        });
      });

      // 2. Prismas 3D de Stands: ocultos en la vista general; visibles solo en el piso seleccionado
      Object.keys(standVisuals).forEach(id => {
        const vis = standVisuals[id];
        const onActiveFloor = (!isOverview && vis.stand.level === sel);
        vis.group.visible = onActiveFloor;

        if (!onActiveFloor) return;

        const isStandSelected = (state.selectedStandId === id);
        if (state.selectedStandId) {
          if (isStandSelected) {
            vis.bodyMat.opacity = 0.82;
            vis.bodyMat.emissiveIntensity = 0.68;
            vis.baseMat.opacity = 0.98;
            vis.baseMat.emissiveIntensity = 0.74;
            vis.edgeMat.opacity = 1.0;
          } else {
            vis.bodyMat.opacity = 0.22;
            vis.bodyMat.emissiveIntensity = 0.12;
            vis.baseMat.opacity = 0.35;
            vis.baseMat.emissiveIntensity = 0.12;
            vis.edgeMat.opacity = 0.32;
          }
        } else {
          vis.bodyMat.opacity = 0.64;
          vis.bodyMat.emissiveIntensity = 0.38;
          vis.baseMat.opacity = 0.92;
          vis.baseMat.emissiveIntensity = 0.45;
          vis.edgeMat.opacity = 0.96;
        }
        vis.bodyMat.needsUpdate = true;
        vis.baseMat.needsUpdate = true;
        vis.edgeMat.needsUpdate = true;
      });
    }

    // =========================================================================
    // 11. CÁMARAS AUTOMÁTICAS ADAPTADAS A CELULAR VERTICAL Y ESCRITORIO
    // =========================================================================
    const FLOOR_VIEWS = {
      '-1': { pos: [-58, 30, 42], target: [-6, 6.8, 0] },
      '0':  { pos: [-34, 44, 42], target: [-8, 1.5, -1.0] },
      '2':  { pos: [-22, 38, 40], target: [-6, 6.8, 9.0] },
      '3':  { pos: [4, 38, 40],   target: [5, 9.5, 7.5] },
      '4':  { pos: [-16, 44, 44], target: [-5, 12.5, 7.5] }
    };

    // Ajusta distancia y encuadre si el celular está en vertical (portrait) para que entre todo el edificio/piso
    function getResponsiveCameraPose(posArr, targetArr, isStandZoom = false) {
      const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
      const target = new THREE.Vector3(...targetArr);
      const pos = new THREE.Vector3(...posArr);

      if (aspect < 0.95) {
        const offset = pos.clone().sub(target);
        const factor = isStandZoom
          ? Math.min(1.42, Math.max(1.08, 0.96 / Math.max(aspect, 0.52)))
          : Math.min(1.62, Math.max(1.12, 1.04 / Math.max(aspect, 0.50)));
        offset.multiplyScalar(factor);
        // Elevar ligeramente el ángulo en móvil para ver mejor los stands desde arriba
        offset.y *= isStandZoom ? 1.12 : 1.08;
        pos.copy(target).add(offset);
        // Desplazar sutilmente el centro hacia abajo para despejar la barra inferior móvil
        target.y -= isStandZoom ? 0.6 : 1.2;
      }

      return { pos, target };
    }

    function animateCameraTo(posArr, targetArr, isStandZoom = false) {
      const pose = getResponsiveCameraPose(posArr, targetArr, isStandZoom);
      state.camAnim = {
        startPos: camera.position.clone(),
        endPos: pose.pos,
        startTarget: controls.target.clone(),
        endTarget: pose.target,
        t: 0
      };
    }

    function resetCurrentCameraView() {
      if (state.selectedStandId) {
        const stand = STANDS_DATA.find(s => s.id === state.selectedStandId);
        if (stand && stand.camPos && stand.camTarget) {
          animateCameraTo(stand.camPos, stand.camTarget, true);
          return;
        }
      }
      const view = FLOOR_VIEWS[String(state.selectedLevel)] || FLOOR_VIEWS['-1'];
      animateCameraTo(view.pos, view.target, false);
    }

    function dismissTouchHint() {
      if (state.hintDismissed) return;
      state.hintDismissed = true;
      const hint = document.getElementById('touch-hint');
      if (hint) {
        hint.style.opacity = '0';
        setTimeout(() => hint.classList.add('hidden'), 500);
      }
    }

    // =========================================================================
    // 12. SELECCIÓN DE PISO AISLADO Y STANDS (ESCRITORIO + CELULAR)
    // =========================================================================
    function updateActiveButtonsAndTags() {
      // Botones inferiores de piso
      document.querySelectorAll('.floor-btn').forEach(btn => {
        const isAct = Number(btn.dataset.floor) === state.selectedLevel;
        btn.classList.toggle('active', isAct);
      });

      // Ítems en escritorio, chips móviles y drawer móvil
      document.querySelectorAll('[data-stand-id]').forEach(el => {
        el.classList.toggle('active', el.dataset.standId === state.selectedStandId);
      });

      // Etiquetas 3D flotantes
      standLabelElements.forEach(({ stand, el }) => {
        const isAct = stand.id === state.selectedStandId;
        el.classList.toggle('stand-selected', isAct);
        if (isAct) {
          el.style.borderColor = stand.borderColor || stand.color;
          el.style.boxShadow = `0 0 18px ${stand.color}70, 0 8px 22px rgba(0,0,0,0.75)`;
        } else {
          el.style.borderColor = `${stand.color}85`;
          el.style.boxShadow = '0 6px 18px rgba(0, 0, 0, 0.55)';
        }
      });
    }

    function setMobileDrawerOpen(open) {
      state.mobileDrawerOpen = open;
      document.getElementById('mobile-stands-drawer').classList.toggle('hidden', !open);
      document.getElementById('mobile-drawer-backdrop').classList.toggle('hidden', !open);
    }

    function renderFloorUI() {
      // A. Elementos de escritorio
      const desktopCard = document.getElementById('floor-panel-card');
      const titleEl = document.getElementById('floor-panel-title');
      const subtitleEl = document.getElementById('floor-panel-subtitle');
      const dotEl = document.getElementById('floor-panel-dot');
      const listEl = document.getElementById('floor-stands-list');
      const selCard = document.getElementById('selected-stand-card');

      // B. Elementos de celular
      const mobileBar = document.getElementById('mobile-floor-bar');
      const mobileChipsView = document.getElementById('mobile-chips-view');
      const mobileChipsWrap = document.getElementById('mobile-stands-chips');
      const mobileStandDetail = document.getElementById('mobile-stand-detail');
      const mobileDrawerCount = document.getElementById('mobile-drawer-count');
      const mobileDrawerDot = document.getElementById('mobile-drawer-dot');
      const mobileDrawerTitle = document.getElementById('mobile-drawer-title');
      const mobileDrawerList = document.getElementById('mobile-drawer-list');

      if (state.selectedLevel === -1) {
        desktopCard.classList.add('hidden');
        mobileBar.classList.add('hidden');
        setMobileDrawerOpen(false);
        return;
      }

      const lvlMeta = LEVELS_META[state.selectedLevel];
      const floorStands = STANDS_DATA.filter(s => s.level === state.selectedLevel);
      const cleanTitle = state.selectedLevel === 3 ? 'Entrepiso (s/ 1° Piso)' : lvlMeta.name.replace(' (3 Cotas)', '');

      // --- 1. Render Escritorio ---
      desktopCard.classList.remove('hidden');
      titleEl.textContent = cleanTitle;
      subtitleEl.textContent = `${floorStands.length} ${floorStands.length === 1 ? 'stand en este piso' : 'stands en este piso'} · Tocá uno para enfocar`;
      dotEl.style.backgroundColor = lvlMeta.color;
      dotEl.style.boxShadow = `0 0 8px ${lvlMeta.color}`;

      listEl.innerHTML = '';
      floorStands.forEach(stand => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.standId = stand.id;
        btn.className = 'stand-list-item w-full text-left px-2.5 py-2.5 rounded-xl border border-slate-700/55 bg-slate-900/55 flex items-center gap-2.5';
        btn.innerHTML = `
          <span class="w-3.5 h-3.5 rounded-md shrink-0 border border-white/25" style="background:${stand.color};box-shadow:0 0 8px ${stand.color}55"></span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-medium text-slate-100 truncate">${stand.name}</div>
            <div class="text-[10px] text-slate-400 truncate">${stand.rooms}</div>
          </div>
        `;
        btn.addEventListener('click', () => {
          if (state.selectedStandId === stand.id) {
            selectFloor(state.selectedLevel, true);
          } else {
            selectStand(stand.id, true);
          }
        });
        listEl.appendChild(btn);
      });

      if (state.selectedStandId) {
        const stand = STANDS_DATA.find(s => s.id === state.selectedStandId);
        if (stand) {
          selCard.classList.remove('hidden');
          const sw = document.getElementById('sel-stand-swatch');
          sw.style.backgroundColor = stand.color;
          sw.style.boxShadow = `0 0 8px ${stand.color}`;
          document.getElementById('sel-stand-name').textContent = stand.name;
          document.getElementById('sel-stand-rooms').textContent = `Ubicación: ${stand.floorGroup} — ${stand.rooms}.`;
        }
      } else {
        selCard.classList.add('hidden');
      }

      // --- 2. Render Celular ---
      mobileBar.classList.remove('hidden');
      mobileDrawerCount.textContent = `Lista (${floorStands.length})`;
      mobileDrawerDot.style.backgroundColor = lvlMeta.color;
      mobileDrawerDot.style.boxShadow = `0 0 8px ${lvlMeta.color}`;
      mobileDrawerTitle.textContent = `${cleanTitle} · ${floorStands.length} ${floorStands.length === 1 ? 'stand' : 'stands'}`;

      // Chips horizontales rápidos
      mobileChipsWrap.innerHTML = '';
      mobileDrawerList.innerHTML = '';
      floorStands.forEach(stand => {
        // Chip horizontal
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.dataset.standId = stand.id;
        chip.className = 'stand-chip shrink-0 h-10 px-3 rounded-xl border border-slate-700/70 bg-slate-900/75 text-slate-100 text-xs font-medium flex items-center gap-2 active:scale-95';
        chip.innerHTML = `
          <span class="w-3 h-3 rounded-full shrink-0 border border-white/30" style="background:${stand.color};box-shadow:0 0 7px ${stand.color}70"></span>
          <span class="max-w-[160px] truncate">${stand.name}</span>
        `;
        chip.addEventListener('click', () => selectStand(stand.id, true));
        mobileChipsWrap.appendChild(chip);

        // Fila grande en Drawer móvil (mínimo 48px de alto para tap perfecto)
        const row = document.createElement('button');
        row.type = 'button';
        row.dataset.standId = stand.id;
        row.className = 'stand-list-item w-full min-h-[50px] text-left px-3 py-2.5 rounded-xl border border-slate-700/55 bg-slate-900/65 flex items-center gap-3 active:scale-[0.99]';
        row.innerHTML = `
          <span class="w-4 h-4 rounded-md shrink-0 border border-white/30" style="background:${stand.color};box-shadow:0 0 9px ${stand.color}60"></span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-slate-100 leading-snug">${stand.name}</div>
            <div class="text-[11px] text-slate-400 leading-snug mt-0.5">${stand.rooms}</div>
          </div>
        `;
        row.addEventListener('click', () => {
          setMobileDrawerOpen(false);
          selectStand(stand.id, true);
        });
        mobileDrawerList.appendChild(row);
      });

      if (state.selectedStandId) {
        const stand = STANDS_DATA.find(s => s.id === state.selectedStandId);
        if (stand) {
          mobileChipsView.classList.add('hidden');
          mobileStandDetail.classList.remove('hidden');
          const mSw = document.getElementById('mob-stand-swatch');
          mSw.style.backgroundColor = stand.color;
          mSw.style.boxShadow = `0 0 8px ${stand.color}`;
          document.getElementById('mob-stand-name').textContent = stand.name;
          document.getElementById('mob-stand-rooms').textContent = stand.rooms;

          const showNavArrows = floorStands.length > 1;
          document.getElementById('btn-mob-prev-stand').classList.toggle('hidden', !showNavArrows);
          document.getElementById('btn-mob-next-stand').classList.toggle('hidden', !showNavArrows);
        }
      } else {
        mobileStandDetail.classList.add('hidden');
        mobileChipsView.classList.remove('hidden');
      }

      updateActiveButtonsAndTags();
    }

    function selectFloor(levelIdx, moveCamera = true) {
      if (levelIdx !== -1 && !STAND_FLOOR_INDICES.includes(levelIdx)) return;

      dismissTouchHint();
      setMobileDrawerOpen(false);
      state.selectedLevel = levelIdx;
      state.selectedStandId = null;

      if (typeof gtag === 'function') {
        const floorLabel = levelIdx === -1 ? 'Edificio Completo' : (LEVELS_META[levelIdx] ? LEVELS_META[levelIdx].name : String(levelIdx));
        gtag('event', 'ver_piso', {
          piso_id: String(levelIdx),
          piso_nombre: floorLabel
        });
      }

      updateVisualMaterials();
      renderFloorUI();
      updateActiveButtonsAndTags();

      if (moveCamera) {
        const view = FLOOR_VIEWS[String(levelIdx)] || FLOOR_VIEWS['-1'];
        animateCameraTo(view.pos, view.target, false);
      }
    }

    function selectStand(standId, moveCamera = true) {
      const stand = STANDS_DATA.find(s => s.id === standId);
      if (!stand) return;

      dismissTouchHint();
      setMobileDrawerOpen(false);
      state.selectedLevel = stand.level;
      state.selectedStandId = stand.id;

      if (typeof gtag === 'function') {
        gtag('event', 'ver_stand', {
          stand_id: stand.id,
          stand_nombre: stand.name,
          stand_piso: stand.floorGroup
        });
      }

      if (state.floorPanelCollapsed) {
        state.floorPanelCollapsed = false;
        const bodyEl = document.getElementById('floor-panel-body');
        const colBtn = document.getElementById('btn-collapse-floor-panel');
        if (bodyEl) bodyEl.classList.remove('hidden');
        if (colBtn) colBtn.textContent = '−';
      }

      updateVisualMaterials();
      renderFloorUI();
      updateActiveButtonsAndTags();

      if (moveCamera && stand.camPos && stand.camTarget) {
        animateCameraTo(stand.camPos, stand.camTarget, true);
      }
    }

    function cycleStandInActiveFloor(delta) {
      if (state.selectedLevel === -1) return;
      const floorStands = STANDS_DATA.filter(s => s.level === state.selectedLevel);
      if (floorStands.length <= 1) return;

      const curIdx = floorStands.findIndex(s => s.id === state.selectedStandId);
      const nextIdx = curIdx === -1
        ? 0
        : (curIdx + delta + floorStands.length) % floorStands.length;

      selectStand(floorStands[nextIdx].id, true);
    }

    // =========================================================================
    // 13. ETIQUETAS 3D FLOTANTES DE STANDS
    // =========================================================================
    function initStandLabels() {
      const layer = document.getElementById('labels-layer');
      layer.innerHTML = '';
      standLabelElements = [];

      STANDS_DATA.forEach(stand => {
        (stand.labels || []).forEach(lbl => {
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'stand-tag-3d';
          el.style.borderColor = `${stand.color}85`;
          el.innerHTML = `
            <span class="stand-tag-dot" style="background:${stand.color};color:${stand.color}"></span>
            <span class="stand-tag-label">${lbl.label}</span>
          `;
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            selectStand(stand.id, true);
          });
          layer.appendChild(el);
          standLabelElements.push({ stand, lbl, el });
        });
      });

      updateActiveButtonsAndTags();
    }

    function projectStandLabels() {
      if (!renderer || !camera) return;
      const w = renderer.domElement.clientWidth;
      const h = renderer.domElement.clientHeight;
      const projVec = new THREE.Vector3();

      standLabelElements.forEach(({ stand, lbl, el }) => {
        if (state.selectedLevel === -1 || stand.level !== state.selectedLevel) {
          el.style.display = 'none';
          return;
        }

        projVec.set(lbl.x + BLDG_OFFSET_X, lbl.y, lbl.z + BLDG_OFFSET_Z);
        projVec.project(camera);

        if (projVec.z > 1 || projVec.x < -1.08 || projVec.x > 1.08 || projVec.y < -1.08 || projVec.y > 1.08) {
          el.style.display = 'none';
          return;
        }

        const sx = (projVec.x * 0.5 + 0.5) * w;
        const sy = (-projVec.y * 0.5 + 0.5) * h;
        el.style.display = 'inline-flex';
        el.style.left = sx + 'px';
        el.style.top = sy + 'px';

        const dimmed = Boolean(state.selectedStandId && state.selectedStandId !== stand.id);
        el.style.opacity = dimmed ? '0.42' : '0.98';
      });
    }

    // =========================================================================
    // 14. BUSCADOR GLOBAL DE STANDS
    // =========================================================================
    function normalizeText(str) {
      return (str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function setSearchOpen(open) {
      state.searchOpen = open;
      const pop = document.getElementById('search-popover');
      const backdrop = document.getElementById('search-backdrop');
      const input = document.getElementById('stand-search');
      pop.classList.toggle('hidden', !open);
      backdrop.classList.toggle('hidden', !open);

      if (open) {
        setMobileDrawerOpen(false);
        renderSearchResults(input.value);
        setTimeout(() => input.focus(), 60);
      }
    }

    function renderSearchResults(rawQuery) {
      const container = document.getElementById('search-results');
      const clearBtn = document.getElementById('btn-clear-search');
      const q = normalizeText(rawQuery.trim());
      clearBtn.classList.toggle('hidden', q.length === 0);

      const matches = STANDS_DATA.filter(s => {
        if (!q) return true;
        const hay = normalizeText(`${s.name} ${s.rooms} ${s.floorGroup} ${s.floorCode}`);
        return hay.includes(q);
      });

      container.innerHTML = '';
      if (matches.length === 0) {
        container.innerHTML = '<div class="px-3 py-4 text-center text-xs text-slate-400">No se encontraron stands con ese nombre.</div>';
        return;
      }

      matches.forEach(stand => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'stand-list-item w-full min-h-[46px] text-left px-3 py-2 rounded-xl border border-slate-700/55 bg-slate-900/65 flex items-center gap-2.5';
        btn.innerHTML = `
          <span class="w-3.5 h-3.5 rounded-md shrink-0 border border-white/25" style="background:${stand.color};box-shadow:0 0 8px ${stand.color}55"></span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-semibold text-slate-100 truncate">${stand.name}</div>
            <div class="text-[10px] text-slate-400 truncate">${stand.floorGroup} · ${stand.rooms}</div>
          </div>
          <span class="px-1.5 py-0.5 rounded-md bg-slate-800/90 border border-slate-700/70 text-[10px] font-mono text-sky-200 shrink-0">${stand.shortFloor}</span>
        `;
        btn.addEventListener('click', () => {
          setSearchOpen(false);
          selectStand(stand.id, true);
        });
        container.appendChild(btn);
      });
    }

    // =========================================================================
    // 15. CONEXIÓN DE CONTROLES UI
    // =========================================================================
    function initUI() {
      // Botones inferiores de pisos
      document.querySelectorAll('.floor-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectFloor(Number(btn.dataset.floor), true);
        });
      });

      // Botón Centrar Vista
      document.getElementById('btn-reset-view').addEventListener('click', () => {
        dismissTouchHint();
        resetCurrentCameraView();
      });

      // Buscador
      document.getElementById('btn-toggle-search').addEventListener('click', () => {
        dismissTouchHint();
        setSearchOpen(!state.searchOpen);
      });
      document.getElementById('btn-close-search').addEventListener('click', () => setSearchOpen(false));
      document.getElementById('search-backdrop').addEventListener('click', () => setSearchOpen(false));

      const searchInput = document.getElementById('stand-search');
      searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
      document.getElementById('btn-clear-search').addEventListener('click', () => {
        searchInput.value = '';
        renderSearchResults('');
        searchInput.focus();
      });

      // Panel derecho (escritorio)
      document.getElementById('btn-collapse-floor-panel').addEventListener('click', () => {
        state.floorPanelCollapsed = !state.floorPanelCollapsed;
        document.getElementById('floor-panel-body').classList.toggle('hidden', state.floorPanelCollapsed);
        document.getElementById('btn-collapse-floor-panel').textContent = state.floorPanelCollapsed ? '+' : '−';
      });
      document.getElementById('btn-deselect-stand').addEventListener('click', () => {
        selectFloor(state.selectedLevel, true);
      });

      // Drawer y controles móviles
      document.getElementById('btn-open-mobile-drawer').addEventListener('click', () => {
        setMobileDrawerOpen(true);
      });
      document.getElementById('btn-close-mobile-drawer').addEventListener('click', () => {
        setMobileDrawerOpen(false);
      });
      document.getElementById('mobile-drawer-backdrop').addEventListener('click', () => {
        setMobileDrawerOpen(false);
      });
      document.getElementById('btn-mob-prev-stand').addEventListener('click', () => {
        cycleStandInActiveFloor(-1);
      });
      document.getElementById('btn-mob-next-stand').addEventListener('click', () => {
        cycleStandInActiveFloor(1);
      });
      document.getElementById('btn-mob-deselect').addEventListener('click', () => {
        selectFloor(state.selectedLevel, true);
      });

      // Tecla Escape para cerrar overlays
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (state.searchOpen) setSearchOpen(false);
          if (state.mobileDrawerOpen) setMobileDrawerOpen(false);
        }
      });

      renderSearchResults('');
    }

    // =========================================================================
    // 16. INICIALIZACIÓN DE ESCENA THREE.JS, INTERACCIÓN Y BUCLE DE RENDER
    // =========================================================================
    function initScene() {
      const container = document.getElementById('canvas-container');
      const isMobile = window.innerWidth < 768;

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0b101b, 0.0034);

      camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.4, 460);
      const initPose = getResponsiveCameraPose(FLOOR_VIEWS['-1'].pos, FLOOR_VIEWS['-1'].target, false);
      camera.position.copy(initPose.pos);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      container.appendChild(renderer.domElement);

      // OrbitControls con respaldo táctil automático
      if (typeof THREE.OrbitControls === 'function') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.075;
        controls.minDistance = 8;
        controls.maxDistance = 195;
        controls.maxPolarAngle = Math.PI * 0.495;
        controls.rotateSpeed = isMobile ? 0.85 : 1.0;
        if (THREE.TOUCH) {
          controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
          };
        }
        controls.target.copy(initPose.target);
        controls.update();
      } else {
        controls = new FallbackOrbitControls(camera, renderer.domElement);
        controls.target.copy(initPose.target);
        controls.update();
      }

      // Iluminación de estudio arquitectónico
      const hemi = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.76);
      hemi.position.set(0, 65, 0);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff7ed, 1.15);
      sun.position.set(-48, 72, 42);
      sun.castShadow = true;
      const shadowRes = isMobile ? 1024 : 2048;
      sun.shadow.mapSize.width = shadowRes;
      sun.shadow.mapSize.height = shadowRes;
      sun.shadow.camera.near = 10;
      sun.shadow.camera.far = 210;
      sun.shadow.camera.left = -62;
      sun.shadow.camera.right = 62;
      sun.shadow.camera.top = 52;
      sun.shadow.camera.bottom = -52;
      sun.shadow.bias = -0.0006;
      scene.add(sun);

      const fill = new THREE.DirectionalLight(0x7dd3fc, 0.44);
      fill.position.set(55, 34, -45);
      scene.add(fill);

      const lightHall = new THREE.PointLight(0xffedd5, 0.55, 22);
      lightHall.position.set(BLDG_OFFSET_X + 8.5, 4.2, BLDG_OFFSET_Z + 7.5);
      scene.add(lightHall);

      const lightPulmon = new THREE.PointLight(0xe0f2fe, 0.65, 28);
      lightPulmon.position.set(BLDG_OFFSET_X + 47.0, 10.5, BLDG_OFFSET_Z + 7.2);
      scene.add(lightPulmon);

      // Base urbana de Calle Perú + arbolado
      buildSiteBase();

      // Edificio de 7 niveles
      buildingRoot = new THREE.Group();
      buildingRoot.position.set(BLDG_OFFSET_X, 0, BLDG_OFFSET_Z);
      scene.add(buildingRoot);

      const builders = [buildPB, buildEPPB, build1P, buildEP1P, build2P, build3P, buildEP3P];
      builders.forEach((fn, idx) => {
        const pal = createLevelPalette();
        const grp = new THREE.Group();
        grp.name = LEVELS_META[idx].code;
        levelPalettes.push(pal);
        levelGroups.push(grp);
        fn(grp, pal);
        buildingRoot.add(grp);
      });

      // Prismas 3D de stands de exposición
      buildStands();

      // Raycasting táctil y de mouse solo sobre stands visibles del piso activo
      raycaster = new THREE.Raycaster();
      pointer = new THREE.Vector2();

      renderer.domElement.addEventListener('pointerdown', (e) => {
        dismissTouchHint();
        state.activePointers.add(e.pointerId);
        if (state.activePointers.size > 1) {
          state.wasMultiTouch = true;
        } else {
          state.wasMultiTouch = false;
          state.pointerDownPos.x = e.clientX;
          state.pointerDownPos.y = e.clientY;
        }
        state.camAnim = null;
      });

      renderer.domElement.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch' || state.selectedLevel === -1) {
          container.classList.remove('hover-stand');
          return;
        }
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(standClickableMeshes, false);
        const hit = hits.find(h => h.object.userData.levelIndex === state.selectedLevel && levelGroups[state.selectedLevel].visible);
        container.classList.toggle('hover-stand', Boolean(hit));
      });

      const handlePointerEnd = (e) => {
        state.activePointers.delete(e.pointerId);
        if (state.wasMultiTouch) {
          if (state.activePointers.size === 0) state.wasMultiTouch = false;
          return;
        }
        if (e.button !== undefined && e.button !== 0 && e.pointerType !== 'touch') return;

        const dist = Math.hypot(e.clientX - state.pointerDownPos.x, e.clientY - state.pointerDownPos.y);
        if (dist > 9 || state.selectedLevel === -1) return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(standClickableMeshes, false);
        const hit = hits.find(h => {
          const sid = h.object.userData.standId;
          return sid && standVisuals[sid] && standVisuals[sid].group.visible;
        });

        if (hit) {
          selectStand(hit.object.userData.standId, true);
        }
      };

      renderer.domElement.addEventListener('pointerup', handlePointerEnd);
      renderer.domElement.addEventListener('pointercancel', (e) => {
        state.activePointers.delete(e.pointerId);
        if (state.activePointers.size === 0) state.wasMultiTouch = false;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      updateVisualMaterials();
      initStandLabels();
      initUI();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      animClock += 0.016;

      // Pulso luminoso sutil sobre el stand seleccionado
      if (state.selectedStandId && standVisuals[state.selectedStandId]) {
        const vis = standVisuals[state.selectedStandId];
        if (vis.group.visible) {
          vis.bodyMat.emissiveIntensity = 0.58 + Math.sin(animClock * 3.4) * 0.16;
        }
      }

      // Transición suave de cámara
      if (state.camAnim) {
        state.camAnim.t = Math.min(1, state.camAnim.t + 0.055);
        const ease = 1 - Math.pow(1 - state.camAnim.t, 3);
        camera.position.lerpVectors(state.camAnim.startPos, state.camAnim.endPos, ease);
        controls.target.lerpVectors(state.camAnim.startTarget, state.camAnim.endTarget, ease);
        if (state.camAnim.t >= 1) state.camAnim = null;
      }

      controls.update();
      renderer.render(scene, camera);
      projectStandLabels();
    }

    window.onload = function () {
      if (typeof THREE === 'undefined') {
        document.body.innerHTML = '<div style="padding:32px;color:#e2e8f0;font-family:sans-serif;text-align:center">No se pudo cargar Three.js. Verificá tu conexión a internet y recargá la página.</div>';
        return;
      }
      try {
        initScene();
      } catch (err) {
        console.error('Error al iniciar el mapa 3D:', err);
        document.body.innerHTML = '<div style="padding:32px;color:#fecaca;font-family:sans-serif;text-align:center">Ocurrió un error al inicializar el mapa 3D. Recargá la página para reintentar.</div>';
      }
    };
  })();
  </script>
</body>
